<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameZone</title>
<style>
:root{--bg:#080d1b;--panel:#111a30;--panel2:#182442;--cyan:#35e6ff;--pink:#ff4fd8;--text:#f4f7ff;--muted:#aab6d2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#1b2850 0,#080d1b 42%);color:var(--text);font-family:system-ui,Arial,sans-serif;min-height:100vh}
header{padding:22px 16px 14px;text-align:center}h1{font-size:clamp(30px,7vw,48px);margin:0;color:var(--cyan);text-shadow:0 0 18px #35e6ff66}header p{color:var(--muted);margin:5px 0 15px}
.wrap{max-width:900px;margin:auto;padding:0 14px 40px}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:#111a30cc;border:1px solid #2a3b62;border-radius:16px;padding:12px;margin-bottom:18px}
button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px 15px;color:#07111e;background:linear-gradient(100deg,var(--cyan),#83f6ff);font-weight:750}
button.secondary{background:#263555;color:var(--text);border:1px solid #40547d}button:disabled{opacity:.45;cursor:not-allowed}
input{font:inherit;background:#0b1327;color:white;border:1px solid #40547d;border-radius:10px;padding:10px;max-width:170px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.game{background:linear-gradient(145deg,#172441,#10182c);border:1px solid #2c416b;border-radius:17px;padding:18px 12px;text-align:center;min-height:142px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.game .emoji{font-size:36px}.game b{font-size:16px}.game button{width:100%;padding:9px}
.panel{background:#111a30;border:1px solid #2c416b;border-radius:18px;padding:16px;margin-top:14px}
.hidden{display:none!important}.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.status{text-align:center;color:var(--cyan);font-weight:700;min-height:28px;margin:10px 0}
.board{display:grid;gap:5px;justify-content:center;margin:14px auto}.cell{background:#263656;color:white;border:1px solid #43577d;border-radius:9px;display:grid;place-items:center;font-weight:800;min-width:0}
.ttt{grid-template-columns:repeat(3, min(26vw,86px))}.ttt .cell{height:min(26vw,86px);font-size:36px}
.memory{grid-template-columns:repeat(4,min(19vw,72px))}.memory .cell{height:min(19vw,72px);font-size:27px}
.puzzle{grid-template-columns:repeat(3,min(25vw,82px))}.puzzle .cell{height:min(25vw,82px);font-size:25px}
canvas{display:block;max-width:100%;margin:12px auto;border-radius:12px;background:#07111e;border:1px solid #40547d}
.track{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:14px auto}.token{background:#273858;border:1px solid #50678f;border-radius:12px;padding:12px;min-width:60px;text-align:center}
.chess{grid-template-columns:repeat(8,min(10.5vw,48px));gap:0}.chess .cell{height:min(10.5vw,48px);border-radius:0;font-size:clamp(18px,5vw,30px);padding:0}.light{background:#e4e8ee;color:#152039}.dark{background:#647795;color:#fff}.selected{outline:3px solid #35e6ff;z-index:1}
footer{text-align:center;color:#7f8eae;font-size:12px;margin-top:24px}
</style>
</head>
<body>
<header><h1>🎮 GAMEZONE</h1><p>Play, earn points and have fun!</p></header>
<main class="wrap">
 <section class="top"><div>Player: <b id="player">Player</b> · ⭐ <b id="points">0</b> points · Games: <b id="played">0</b></div><div class="row"><input id="nameInput" placeholder="Your nickname" maxlength="16"><button class="secondary" onclick="saveName()">Save name</button></div></section>
 <section id="home"><div class="grid" id="games"></div></section>
 <section id="play" class="panel hidden"><div class="row" style="justify-content:space-between"><button class="secondary" onclick="home()">← All games</button><h2 id="gameTitle" style="margin:0">Game</h2><span></span></div><div id="gameArea"></div></section>
 <footer>GameZone starter · Your profile and scores are saved on this device. Online multiplayer is a future upgrade.</footer>
</main>
<script>
const catalog=[
 ['snake','🐍','Snake'],['ttt','❌','Tic-Tac-Toe'],['race','🏎️','Car Racing'],['chess','♟️','Chess'],['football','⚽','Football'],['target','🎯','Target Game'],['memory','🧠','Memory'],['ludo','🎲','Ludo'],['puzzle','🧩','Puzzle']
];
let profile=JSON.parse(localStorage.gzProfile||'{"name":"Player","points":0,"played":0}');
function updateProfile(){document.getElementById('player').textContent=profile.name;document.getElementById('points').textContent=profile.points;document.getElementById('played').textContent=profile.played;localStorage.gzProfile=JSON.stringify(profile)}
function saveName(){let n=document.getElementById('nameInput').value.trim();if(n){profile.name=n;updateProfile();document.getElementById('nameInput').value=''}}
function award(n=5){profile.points+=n;updateProfile()}
function home(){document.getElementById('home').classList.remove('hidden');document.getElementById('play').classList.add('hidden');if(window.gameCleanup)window.gameCleanup();window.gameCleanup=null}
function start(id){if(window.gameCleanup)window.gameCleanup();window.gameCleanup=null;profile.played++;updateProfile();document.getElementById('home').classList.add('hidden');document.getElementById('play').classList.remove('hidden');let item=catalog.find(x=>x[0]===id);document.getElementById('gameTitle').textContent=item[1]+' '+item[2];let a=document.getElementById('gameArea');a.innerHTML='';({snake,ttt,race,chess,football,target,memory,ludo,puzzle})[id](a)}
document.getElementById('games').innerHTML=catalog.map(x=>`<article class="game"><div class="emoji">${x[1]}</div><b>${x[2]}</b><button onclick="start('${x[0]}')">Play now</button></article>`).join('');
updateProfile();
function status(a,t){let s=a.querySelector('.status');if(s)s.textContent=t}
function shell(a,msg=''){a.innerHTML=`<div class="status">${msg}</div><div id="board"></div><div class="row" id="controls"></div>`}
function ttt(a){shell(a,'Two players take turns: X and O.');let b=a.querySelector('#board');b.className='board ttt';let turn='X',cells=Array(9).fill(''),wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],done=false;
function draw(){b.innerHTML=cells.map((v,i)=>`<button class="cell" data-i="${i}">${v}</button>`).join('');b.querySelectorAll('button').forEach(x=>x.onclick=()=>{let i=+x.dataset.i;if(done||cells[i])return;cells[i]=turn;let win=wins.some(w=>w.every(k=>cells[k]===turn));if(win){status(a,turn+' wins! +10 points');award(10);done=true}else if(cells.every(Boolean)){status(a,'It is a draw!');done=true}else{turn=turn==='X'?'O':'X';status(a,turn+"'s turn")}draw()})}a.querySelector('#controls').innerHTML='<button class="secondary" id="reset">Restart</button>';a.querySelector('#reset').onclick=()=>ttt(a);draw()}
function memory(a){shell(a,'Find all matching pairs.');let b=a.querySelector('#board');b.className='board memory';let vals=['🐱','🐶','🍎','🚀','⚽','🌟','🎲','🎧', '🐱','🐶','🍎','🚀','⚽','🌟','🎲','🎧'].sort(()=>Math.random()-.5),open=[],matched=new Set(),lock=false,moves=0;
function draw(){b.innerHTML=vals.map((v,i)=>`<button class="cell" data-i="${i}">${matched.has(i)||open.includes(i)?v:'?'}</button>`).join('');b.querySelectorAll('button').forEach(x=>x.onclick=()=>{let i=+x.dataset.i;if(lock||matched.has(i)||open.includes(i))return;open.push(i);draw();if(open.length===2){moves++;if(vals[open[0]]===vals[open[1]]){open.forEach(k=>matched.add(k));open=[];if(matched.size===16){status(a,'You matched every pair! +15 points');award(15)}else status(a,'Good match! Moves: '+moves);draw()}else{lock=true;let pair=[...open];setTimeout(()=>{open=[];lock=false;draw();status(a,'Try again · Moves: '+moves)},750)}}})}draw()}
function puzzle(a){shell(a,'Slide tiles into the empty space to arrange 1–8.');let b=a.querySelector('#board');b.className='board puzzle';let v=[1,2,3,4,5,6,7,0,8];function draw(){b.innerHTML=v.map((n,i)=>`<button class="cell" data-i="${i}" ${n===0?'disabled':''}>${n||''}</button>`).join('');b.querySelectorAll('button').forEach(x=>x.onclick=()=>{let i=+x.dataset.i,z=v.indexOf(0);if([z-3,z+3,z-1,z+1].includes(i)&&!(Math.abs(z-i)===1&&Math.floor(z/3)!==Math.floor(i/3))){[v[z],v[i]]=[v[i],v[z]];draw();if(v.join()==='1,2,3,4,5,6,7,8,0'){status(a,'Puzzle solved! +10 points');award(10)}}})}a.querySelector('#controls').innerHTML='<button class="secondary" id="mix">Shuffle</button>';a.querySelector('#mix').onclick=()=>{for(let k=0;k<80;k++){let z=v.indexOf(0),opts=[z-3,z+3,z-1,z+1].filter(i=>i>=0&&i<9&&!(Math.abs(z-i)===1&&Math.floor(z/3)!==Math.floor(i/3)));let i=opts[Math.floor(Math.random()*opts.length)];[v[z],v[i]]=[v[i],v[z]]}draw();status(a,'Shuffled!')};draw()}
function target(a){shell(a,'Tap 10 targets as quickly as you can!');let b=a.querySelector('#board');b.innerHTML='<div style="position:relative;max-width:340px;height:300px;margin:auto;background:#07111e;border:1px solid #40547d;border-radius:14px" id="arena"></div>';let ar=b.querySelector('#arena'),count=0;let s=a.querySelector('.status');function spawn(){ar.innerHTML='';let t=document.createElement('button');t.textContent='◎';t.style.cssText=`position:absolute;left:${5+Math.random()*78}%;top:${5+Math.random()*72}%;width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;background:radial-gradient(circle,#fff,#ff4fd8 45%,#7425a6)`;t.onclick=()=>{count++;s.textContent='Targets: '+count+'/10';if(count===10){ar.innerHTML='';status(a,'Great aim! +10 points');award(10)}else spawn()};ar.appendChild(t)}spawn()}
function football(a){shell(a,'Penalty shootout! Pick a direction to kick.');let b=a.querySelector('#board');b.innerHTML='<div style="font-size:65px;text-align:center;padding:12px">🥅</div><div class="status" id="result">Where will you shoot?</div>';let c=a.querySelector('#controls');c.innerHTML=['Left','Center','Right'].map(x=>`<button data-d="${x}">${x}</button>`).join('')+'<button class="secondary" id="again">New kick</button>';let score=0,kicks=0;c.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{if(kicks>=5)return;let save=['Left','Center','Right'][Math.floor(Math.random()*3)];kicks++;if(x.dataset.d!==save){score++;b.querySelector('#result').textContent='GOAL! Keeper dived '+save+'. Score '+score+'/5'}else b.querySelector('#result').textContent='Saved! Keeper guessed '+save+'. Score '+score+'/5';if(kicks===5){status(a,'Shootout finished: '+score+' goals. +'+score*2+' points');award(score*2)}});c.querySelector('#again').onclick=()=>football(a)}
function race(a){shell(a,'Use the lane buttons to dodge traffic for 20 seconds.');let b=a.querySelector('#board');b.innerHTML='<canvas id="road" width="320" height="390"></canvas>';let cv=b.querySelector('canvas'),ctx=cv.getContext('2d'),lane=1,obs=[],score=0,alive=true,start=Date.now();let c=a.querySelector('#controls');c.innerHTML='<button class="secondary" id="left">← Left</button><button class="secondary" id="right">Right →</button>';c.querySelector('#left').onclick=()=>lane=Math.max(0,lane-1);c.querySelector('#right').onclick=()=>lane=Math.min(2,lane+1);let timer=setInterval(()=>{if(!alive)return;obs.push({l:Math.floor(Math.random()*3),y:-40});obs.forEach(o=>o.y+=5);obs=obs.filter(o=>o.y<410);if(obs.some(o=>o.l===lane&&o.y>320&&o.y<375)){alive=false;clearInterval(timer);status(a,'Crash! Score: '+score+' · +'+score+' points');award(score)}else if(Date.now()-start>20000){alive=false;clearInterval(timer);status(a,'Race complete! Score: '+score+' · +'+(score+5)+' points');award(score+5)}else score++},160);function paint(){ctx.clearRect(0,0,320,390);ctx.fillStyle='#1c2942';ctx.fillRect(20,0,280,390);ctx.strokeStyle='#91a3c7';ctx.setLineDash([18,14]);ctx.beginPath();ctx.moveTo(113,0);ctx.lineTo(113,390);ctx.moveTo(207,0);ctx.lineTo(207,390);ctx.stroke();ctx.setLineDash([]);ctx.font='32px sans-serif';obs.forEach(o=>ctx.fillText('🚙',42+o.l*94,o.y));ctx.fillText('🏎️',42+lane*94,365);if(alive)requestAnimationFrame(paint)}paint();window.gameCleanup=()=>clearInterval(timer)}
function snake(a){shell(a,'Use arrows to guide the snake and eat the red food.');let b=a.querySelector('#board');b.innerHTML='<canvas id="sn" width="300" height="300"></canvas>';let cv=b.querySelector('canvas'),ctx=cv.getContext('2d'),snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}],dir={x:1,y:0},food={x:12,y:10},score=0,alive=true;let c=a.querySelector('#controls');c.innerHTML=['↑','←','↓','→'].map((x,i)=>`<button class="secondary" data-d="${i}">${x}</button>`).join('')+'<button class="secondary" id="restart">Restart</button>';let dirs=[{x:0,y:-1},{x:-1,y:0},{x:0,y:1},{x:1,y:0}];c.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{let d=dirs[+x.dataset.d];if(d.x!==-dir.x||d.y!==-dir.y)dir=d});let key=e=>{let d={'ArrowUp':0,'ArrowLeft':1,'ArrowDown':2,'ArrowRight':3}[e.key];if(d!==undefined){let nd=dirs[d];if(nd.x!==-dir.x||nd.y!==-dir.y)dir=nd}};document.addEventListener('keydown',key);let timer=setInterval(()=>{if(!alive)return;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=15||h.y>=15||snake.some(p=>p.x===h.x&&p.y===h.y)){alive=false;clearInterval(timer);status(a,'Game over! Score '+score+' · +'+score+' points');award(score);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food={x:Math.floor(Math.random()*15),y:Math.floor(Math.random()*15)};status(a,'Score: '+score)}else snake.pop();ctx.fillStyle='#07111e';ctx.fillRect(0,0,300,300);ctx.fillStyle='#ff4f75';ctx.fillRect(food.x*20,food.y*20,18,18);ctx.fillStyle='#35e6ff';snake.forEach(p=>ctx.fillRect(p.x*20,p.y*20,18,18))},150);c.querySelector('#restart').onclick=()=>snakeGameRestart();function snakeGameRestart(){window.gameCleanup?.();snake(a)}window.gameCleanup=()=>{clearInterval(timer);document.removeEventListener('keydown',key)}}
function chess(a){shell(a,'Local two-player chess board. Tap a piece, then its destination. Basic piece movement and captures.');let b=a.querySelector('#board');b.className='board chess';let symbols={r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',p:'♟'};let board=['rnbqkbnr','pppppppp','........','........','........','........','PPPPPPPP','RNBQKBNR'].map(row=>row.split(''));let turn='w',sel=null;function draw(){b.innerHTML=board.flat().map((p,i)=>{let r=Math.floor(i/8),c=i%8;return `<button class="cell ${(r+c)%2?'dark':'light'} ${sel===i?'selected':''}" data-i="${i}">${p==='.'?'':symbols[p.toLowerCase()]}</button>`}).join('');b.querySelectorAll('button').forEach(x=>x.onclick=()=>{let i=+x.dataset.i,r=Math.floor(i/8),c=i%8,p=board[r][c];if(sel===null){if(p!=='.'&&((p===p.toUpperCase())===(turn==='w'))){sel=i;draw()}}else{let sr=Math.floor(sel/8),sc=sel%8,sp=board[sr][sc];if(i===sel){sel=null;draw();return}if(p!=='.'&&((p===p.toUpperCase())===(turn==='w'))){sel=i;draw();return}board[r][c]=sp;board[sr][sc]='.';sel=null;turn=turn==='w'?'b':'w';status(a,(turn==='w'?'White':'Black')+' to move');draw()}})}draw();status(a,'White to move')}
function ludo(a){shell(a,'Simple two-player Ludo race. Roll a 6 to leave home; first to reach 30 wins.');let b=a.querySelector('#board');let pos=[-1,-1],turn=0;function draw(){b.innerHTML=`<div class="track"><div class="token">🔴 Red<br><b>${pos[0]<0?'Home':pos[0]+'/30'}</b></div><div class="token">🟢 Green<br><b>${pos[1]<0?'Home':pos[1]+'/30'}</b></div></div><div class="status">Player ${turn+1}'s turn</div>`}a.querySelector('#controls').innerHTML='<button id="roll">Roll dice 🎲</button>';a.querySelector('#roll').onclick=()=>{let n=1+Math.floor(Math.random()*6);if(pos[turn]<0){if(n===6)pos[turn]=0}else pos[turn]=Math.min(30,pos[turn]+n);status(a,'Player '+(turn+1)+' rolled '+n);if(pos[turn]===30){status(a,'Player '+(turn+1)+' wins! +10 points');award(10);a.querySelector('#roll').disabled=true}else turn=1-turn;draw();};draw()}
</script>
</body></html>
